name: Headless build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: headless-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  import-export:
    name: Godot import and export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and Linux export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_RELEASE }}
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-linux-x86_64

      - name: Install Godot (headless) and Linux export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          tag="${GODOT_VERSION}-${GODOT_RELEASE}"
          base="https://github.com/godotengine/godot/releases/download/${tag}"
          tmp="$(mktemp -d)"

          curl -fsSL --retry 3 -o "$tmp/godot.zip" "$base/Godot_v${tag}_linux.x86_64.zip"
          mkdir -p ~/godot-bin
          unzip -q "$tmp/godot.zip" -d "$tmp"
          mv "$tmp/Godot_v${tag}_linux.x86_64" ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

          # The full template bundle is over 1 GB; keep only the Linux x86_64 ones.
          curl -fsSL --retry 3 -o "$tmp/templates.tpz" "$base/Godot_v${tag}_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$dest"
          unzip -q -j "$tmp/templates.tpz" \
            templates/linux_release.x86_64 templates/linux_debug.x86_64 templates/version.txt \
            -d "$dest"
          rm -rf "$tmp"

      - name: Add Godot to PATH
        run: |
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"
          ~/godot-bin/godot --headless --version

      - name: Headless import and export
        run: .github/scripts/headless-build.sh
        env:
          GODOT: godot

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: "**/build/linux/"
          if-no-files-found: error
          retention-days: 7
